name: iOS Build Check

on:
  push:
    branches:
      - feature/ART2-67-socialisation-features
  workflow_dispatch:

jobs:
  ios-build:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: roam_io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Configure iOS project
        run: flutter build ios --config-only


      - name: Verify Live Activity target exists
        run: |
          xcodebuild -project ios/Runner.xcodeproj -list | tee /tmp/xcode-targets.txt
          grep -q "RoamLiveActivity" /tmp/xcode-targets.txt

      - name: Build iOS Simulator app
        run: flutter build ios --simulator
      - name: Verify Live Activity extension is embedded
        run: |
          test -d build/ios/iphonesimulator/Runner.app/PlugIns/RoamLiveActivity.appex
          echo "RoamLiveActivity.appex is embedded in Runner.app"
