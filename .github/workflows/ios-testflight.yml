# Author: Alvin Liong
# Description:
#   On push to develop (including merged PRs), run Flutter quality checks then
#   build a signed iOS IPA and upload it to TestFlight.

name: iOS TestFlight

on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: roam_io

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  testflight:
    name: Build & Upload TestFlight
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Install Apple certificate and provisioning profiles
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          BUILD_PROVISION_PROFILE_EXTENSION_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_EXTENSION_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-roamio-ci-keychain}"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          install_profile() {
            local encoded="$1"
            local label="$2"
            local pp_path="$RUNNER_TEMP/${label}.mobileprovision"
            echo -n "$encoded" | base64 --decode -o "$pp_path"
            security cms -D -i "$pp_path" > "$RUNNER_TEMP/${label}.plist"
            local profile_uuid
            profile_uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/${label}.plist")
            cp "$pp_path" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
            echo "Installed ${label} provisioning profile UUID=${profile_uuid}"
          }

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          install_profile "$BUILD_PROVISION_PROFILE_BASE64" "app"
          install_profile "$BUILD_PROVISION_PROFILE_EXTENSION_BASE64" "live_activity"

      - name: Configure manual signing for CI release
        env:
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
          EXTENSION_PROFILE_NAME: ${{ secrets.EXTENSION_PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          export PROFILE_NAME="${PROFILE_NAME:-Roamio App Store}"
          export EXTENSION_PROFILE_NAME="${EXTENSION_PROFILE_NAME:-Roamio Live Activity App Store}"
          # Keep Automatic in git for local flutter run; override only on the runner.
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()
          app_profile = os.environ["PROFILE_NAME"]
          extension_profile = os.environ["EXTENSION_PROFILE_NAME"]

          def patch_manual_signing(project_text, profile_name, info_plist):
              signing_block = (
                  'CODE_SIGN_IDENTITY = "Apple Distribution";\n'
                  "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
                  "\t\t\t\tDEVELOPMENT_TEAM = AFC5WD785H;\n"
                  f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile_name}";\n'
                  f"\t\t\t\tINFOPLIST_FILE = {info_plist};"
              )
              pattern = (
                  r"DEVELOPMENT_TEAM = AFC5WD785H;\n"
                  r"(?:\t\t\t\t.*\n)*?"
                  rf"\t\t\t\tINFOPLIST_FILE = {re.escape(info_plist)};"
              )
              return re.subn(pattern, signing_block, project_text)

          text, runner_count = patch_manual_signing(text, app_profile, "Runner/Info.plist")
          text, extension_count = patch_manual_signing(
              text, extension_profile, "RoamLiveActivity/Info.plist"
          )
          if runner_count == 0:
              raise SystemExit("Failed to patch Runner manual signing")
          if extension_count == 0:
              raise SystemExit("Failed to patch RoamLiveActivity manual signing")
          path.write_text(text)
          print(
              f"Patched manual signing for Runner ({runner_count}) "
              f"and RoamLiveActivity ({extension_count})"
          )
          PY

          python3 <<PY
          from pathlib import Path
          import os
          app_profile = os.environ["PROFILE_NAME"]
          extension_profile = os.environ["EXTENSION_PROFILE_NAME"]
          Path("ios/ExportOptions.plist").write_text(f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>AFC5WD785H</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fit3170.roamio</key>
              <string>{app_profile}</string>
              <key>com.fit3170.roamio.liveactivity</key>
              <string>{extension_profile}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          """)
          PY
          # Remove incidental indentation from the generated plist.
          sed -i '' 's/^[[:space:]]*//' ios/ExportOptions.plist

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-number="${{ github.run_number }}" \
            --export-options-plist=ios/ExportOptions.plist
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: roam_io/ios

      - name: Upload to TestFlight
        working-directory: roam_io/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IPA_PATH: ${{ github.workspace }}/roam_io/build/ios/ipa/*.ipa
        run: |
          set -euo pipefail
          IPA_FILE=$(ls -1 "${{ github.workspace }}/roam_io/build/ios/ipa/"*.ipa | head -n 1)
          echo "Uploading ${IPA_FILE}"
          bundle install
          IPA_PATH="$IPA_FILE" bundle exec fastlane upload_testflight

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
