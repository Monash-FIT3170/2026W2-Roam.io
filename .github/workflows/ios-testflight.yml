# Author: Alvin Liong
# Description:
#   On push to develop (including merged PRs), run Flutter quality checks then
#   build a signed iOS IPA and upload it to TestFlight.

name: iOS TestFlight

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: roam_io

jobs:
  quality:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test

  testflight:
    name: Build & Upload TestFlight
    needs: quality
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Install Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="${KEYCHAIN_PASSWORD:-roamio-ci-keychain}"
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          echo "Installed provisioning profile UUID=${PROFILE_UUID}"

      - name: Configure manual signing for CI release
        env:
          PROFILE_NAME: ${{ secrets.PROVISIONING_PROFILE_SPECIFIER }}
        run: |
          set -euo pipefail
          export PROFILE_NAME="${PROFILE_NAME:-Roamio App Store}"
          # Keep Automatic in git for local flutter run; override only on the runner.
          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("ios/Runner.xcodeproj/project.pbxproj")
          text = path.read_text()
          profile = os.environ["PROFILE_NAME"]
          # Inject manual signing next to each Runner DEVELOPMENT_TEAM setting.
          text, count = re.subn(
              r"DEVELOPMENT_TEAM = AFC5WD785H;",
              (
                  'CODE_SIGN_IDENTITY = "Apple Distribution";\n'
                  "\t\t\t\tCODE_SIGN_STYLE = Manual;\n"
                  "\t\t\t\tDEVELOPMENT_TEAM = AFC5WD785H;\n"
                  f'\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "{profile}";'
              ),
              text,
          )
          if count == 0:
              raise SystemExit("Failed to patch DEVELOPMENT_TEAM for manual signing")
          path.write_text(text)
          print(f"Patched manual signing in {count} build configuration(s)")
          PY

          python3 <<PY
          from pathlib import Path
          import os
          profile = os.environ["PROFILE_NAME"]
          Path("ios/ExportOptions.plist").write_text(f"""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>AFC5WD785H</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.fit3170.roamio</key>
              <string>{profile}</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          """)
          PY
          # Remove incidental indentation from the generated plist.
          sed -i '' 's/^[[:space:]]*//' ios/ExportOptions.plist

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-number="${{ github.run_number }}" \
            --export-options-plist=ios/ExportOptions.plist
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: roam_io/ios

      - name: Upload to TestFlight
        working-directory: roam_io/ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IPA_PATH: ${{ github.workspace }}/roam_io/build/ios/ipa/*.ipa
        run: |
          set -euo pipefail
          IPA_FILE=$(ls -1 "${{ github.workspace }}/roam_io/build/ios/ipa/"*.ipa | head -n 1)
          echo "Uploading ${IPA_FILE}"
          bundle install
          IPA_PATH="$IPA_FILE" bundle exec fastlane upload_testflight

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
